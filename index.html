<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" id="focus-theme-color" content="#F6F2EA" />
    <title>Focus — Distraction-Free Screenwriting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Prevent flash on refresh: restore theme & status bar color before first paint
      try {
        const raw = localStorage.getItem('focus:settings');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.theme) {
            document.documentElement.setAttribute('data-theme', parsed.theme);
            const meta = document.getElementById('focus-theme-color');
            if (meta) {
              const colors = {
                paper: '#F6F2EA',
                sepia: '#F3ECE0',
                night: '#141312',
              };
              meta.setAttribute('content', colors[parsed.theme] || '#F6F2EA');
            }
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="antialiased selection:bg-[var(--selection-bg)] selection:text-[var(--ink-1)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
